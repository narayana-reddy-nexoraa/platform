apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sop-ls-01-pharmacovigilance
  title: "LS-01: Pharmacovigilance Case Intake and Triage"
  description: >
    Receive ICSRs via any channel, deduplicate, triage seriousness/expectedness,
    code with MedDRA, enter into safety database, route to medical reviewer
    within regulatory deadlines (7-day/15-day).
  annotations:
    github.com/project-slug: nexoraa/platform
    nexoraa.ai/sop-id: LS-01
    nexoraa.ai/industry: LIFE_SCIENCES
    nexoraa.ai/version: "1.0.0"
    nexoraa.ai/process-owner: Head of Global Pharmacovigilance / Drug Safety Director
  tags:
    - life-sciences
    - pharmacovigilance
    - 21-cfr-part-11
    - gvp
    - gxp
    - sop
  links:
    - url: https://docs.nexoraa.ai/sops/ls-01
      title: SOP Documentation
      icon: docs
spec:
  type: sop-workflow
  lifecycle: production
  owner: platform-team
  system: nexoraa-platform
  dependsOn:
    - component:default/nexoraa-temporal-worker
    - component:default/nexoraa-api
