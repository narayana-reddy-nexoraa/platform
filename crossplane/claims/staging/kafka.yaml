---
# Staging Kafka Cluster Claim
# Provisions a 3-broker MSK cluster in us-east-1 for staging.
apiVersion: messaging.nexoraa.io/v1alpha1
kind: KafkaCluster
metadata:
  name: nexoraa-staging-kafka
  namespace: nexoraa-system
  labels:
    app.kubernetes.io/part-of: nexoraa-platform
    app.kubernetes.io/managed-by: crossplane
    environment: staging
spec:
  compositionSelector:
    matchLabels:
      provider: aws
      crossplane.io/xrd: xkafkaclusters.messaging.nexoraa.io
  region: us-east-1
  brokerCount: 3
  instanceType: kafka.m5.large
  storageGB: 500
  writeConnectionSecretToRef:
    name: nexoraa-staging-kafka-conn
