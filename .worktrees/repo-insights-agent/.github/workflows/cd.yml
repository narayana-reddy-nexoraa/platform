name: CD

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - '.github/workflows/cd.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update image tags in K8s manifests
        run: |
          NEW_TAG="${{ steps.sha.outputs.short }}"
          REGISTRY="ghcr.io/${{ github.repository }}"

          # Update API deployment
          sed -i "s|image: ${REGISTRY}:.*|image: ${REGISTRY}:${NEW_TAG}|g" k8s/base/api/deployment.yaml

          # Update Temporal Worker deployment
          sed -i "s|image: ${REGISTRY}:.*|image: ${REGISTRY}:${NEW_TAG}|g" k8s/base/temporal-worker/deployment.yaml

      - name: Commit and push manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "deploy: update image tag to ${{ steps.sha.outputs.short }}"
            git push
          fi

  # ArgoCD will automatically detect the manifest change and sync to the cluster.
  # This job just verifies the sync completed.
  verify-sync:
    name: Verify ArgoCD Sync
    runs-on: ubuntu-latest
    needs: [update-manifests]
    if: ${{ vars.ARGOCD_ENABLED == 'true' }}
    steps:
      - name: Wait for ArgoCD sync
        run: |
          echo "ArgoCD auto-sync will pick up the manifest change."
          echo "Verify at: https://argocd.nexoraa.ai/applications"
          echo ""
          echo "Manual verification:"
          echo "  argocd app get nexoraa-api --refresh"
          echo "  argocd app get nexoraa-temporal-worker --refresh"
