apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexoraa-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexoraa-platform
spec:
  project: default
  source:
    repoURL: https://github.com/narayana-reddy-nexoraa/platform.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
