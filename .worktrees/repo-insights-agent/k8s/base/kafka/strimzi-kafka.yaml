apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nexoraa-kafka
  namespace: nexoraa-system
  labels:
    app.kubernetes.io/name: nexoraa-kafka
    app.kubernetes.io/component: kafka
    app.kubernetes.io/part-of: nexoraa-platform
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: persistent-claim
      size: 100Gi
      deleteClaim: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
