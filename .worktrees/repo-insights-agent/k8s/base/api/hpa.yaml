apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexoraa-api
  namespace: nexoraa-system
  labels:
    app: nexoraa-api
    app.kubernetes.io/name: nexoraa-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexoraa-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexoraa-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
