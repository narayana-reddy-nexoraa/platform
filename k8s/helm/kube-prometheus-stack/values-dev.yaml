# Dev: smaller footprint, no persistent volumes (data lost on pod restart — OK for dev).

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec: {}
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  enabled: false
