apiVersion: v1
kind: Service
metadata:
  name: nexoraa-temporal-worker
  namespace: nexoraa-system
  labels:
    app: nexoraa-temporal-worker
    app.kubernetes.io/name: nexoraa-temporal-worker
    app.kubernetes.io/component: temporal-worker
    app.kubernetes.io/part-of: nexoraa-platform
spec:
  type: ClusterIP
  selector:
    app: nexoraa-temporal-worker
  ports:
    - name: health
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
