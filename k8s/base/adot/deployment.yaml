apiVersion: apps/v1
kind: Deployment
metadata:
  name: adot-amp-collector
  namespace: monitoring
  labels:
    app: adot-amp-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adot-amp-collector
  template:
    metadata:
      labels:
        app: adot-amp-collector
    spec:
      serviceAccountName: amp-remote-write
      containers:
        - name: aws-otel-collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.102.1
          args:
            - "--config=/conf/collector.yaml"
          env:
            # Patched per overlay: must match terraform output amp_remote_write_url and var.region
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_PROMETHEUS_ENDPOINT
              value: https://aps-workspaces.us-east-1.amazonaws.com/workspaces/REPLACE_WORKSPACE_ID/api/v1/remote_write
          ports:
            - name: health
              containerPort: 13133
              protocol: TCP
          volumeMounts:
            - name: adot-config
              mountPath: /conf
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: adot-config
          configMap:
            name: adot-amp-collector-config
