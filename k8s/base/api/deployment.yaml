apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexoraa-api
  namespace: nexoraa-system
  labels:
    app: nexoraa-api
    app.kubernetes.io/name: nexoraa-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexoraa-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexoraa-api
  template:
    metadata:
      labels:
        app: nexoraa-api
        app.kubernetes.io/name: nexoraa-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: nexoraa-platform
    spec:
      containers:
        - name: api
          image: nexoraa/api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexoraa-db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
